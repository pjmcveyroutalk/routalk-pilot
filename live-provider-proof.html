<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Routalk Pilot — Live Provider Proof</title><style>body{font-family:system-ui,sans-serif;max-width:720px;margin:0 auto;padding:24px;background:#0b0f14;color:#eef3f8}input,button{width:100%;box-sizing:border-box;font:inherit;padding:14px;margin:8px 0;border-radius:10px}input{background:#111923;color:#fff;border:1px solid #334155}button{border:0;font-weight:700}button:disabled{opacity:.5}pre{white-space:pre-wrap;word-break:break-word;background:#111923;padding:14px;border-radius:10px}.warn{padding:12px;border:1px solid #7c2d12;border-radius:10px}</style></head><body><h1>Live Provider Proof</h1><p class="warn"><strong>One intentional production proof.</strong> This control can create a real Vercel production deployment. Use it only after readiness is green.</p><label for="secret">Pilot trigger secret</label><input id="secret" type="password" autocomplete="current-password" placeholder="Pilot trigger secret"><label><input id="approve" type="checkbox" style="width:auto"> I approve exactly one live provider proof.</label><button id="run" disabled>Run one live provider proof</button><pre id="out">Waiting.</pre><script>const secret=document.getElementById("secret"),approve=document.getElementById("approve"),run=document.getElementById("run"),out=document.getElementById("out");function update(){run.disabled=!(secret.value&&approve.checked)}secret.addEventListener("input",update);approve.addEventListener("change",update);run.addEventListener("click",async()=>{run.disabled=true;approve.disabled=true;secret.disabled=true;out.textContent="Running exactly one proof… Do not tap again.";try{const response=await fetch("/api/live-provider-proof",{method:"POST",headers:{Authorization:"Bearer "+secret.value,"Content-Type":"application/json"},body:JSON.stringify({confirmation:"LIVE_PROVIDER_PROOF_ONCE",approvalIntent:true})});const result=await response.json();out.textContent=JSON.stringify(result,null,2)}catch(error){out.textContent=JSON.stringify({ok:false,error:String(error)},null,2)}finally{secret.disabled=false;approve.disabled=false;approve.checked=false;update()}});</script></body></html>
