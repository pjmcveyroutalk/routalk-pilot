<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#09111f" />
<title>Routalk Pilot</title>
</head>
<body>
<script>
(async () => {
  const ACTIVE_PROJECT_KEY = "pilot:active-project.v1";
  const DEVICE_SESSION_KEY = "pilot:device-session.v1";
  const CONTROL_REPOSITORY = "pjmcveyroutalk/routalk-pilot";
  const params = new URLSearchParams(location.search);

  function validRepository(value) {
    return typeof value === "string" &&
      /^[A-Za-z0-9_.-]{1,100}\/[A-Za-z0-9_.-]{1,100}$/.test(value);
  }
  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");
  }
  function storageGet(key) {
    try { return localStorage.getItem(key); } catch { return null; }
  }
  function storageSet(key, value) {
    try { localStorage.setItem(key, value); } catch {}
  }

  let projects = [];
  try {
    const response = await fetch("/api/provider-status", {
      credentials: "same-origin",
      cache: "no-store"
    });
    const result = await response.json();
    if (!response.ok || !Array.isArray(result.projects))
      throw new Error(result.error || "Project registry unavailable.");
    projects = result.projects
      .filter(item => item && validRepository(item.repository))
      .map(item => ({ ...item, registered: true, authorized: null }));
  } catch (error) {
    document.body.innerHTML =
      '<main style="max-width:440px;margin:48px auto;padding:24px;color:#fff;font-family:system-ui">' +
      '<h1>Routalk Pilot</h1><p>Project registry could not be loaded.</p>' +
      '<p style="color:#ff9a9a">' + escapeHtml(error.message) + '</p></main>';
    document.body.style.background = "#09111f";
    return;
  }

  const deviceSession = storageGet(DEVICE_SESSION_KEY) || "";
  if (deviceSession) {
    try {
      const response = await fetch("/api/session?action=project-catalog", {
        credentials: "same-origin",
        cache: "no-store",
        headers: { "X-Pilot-Device-Session": deviceSession }
      });
      const result = await response.json();
      if (response.ok && Array.isArray(result.projects)) {
        projects = result.projects.filter(item => item && validRepository(item.repository));
      }
    } catch {
      // Static registered projects remain the safe fallback.
    }
  }

  const repositories = new Set(projects.map(item => item.repository));
  let selected = params.get("repository") || "";
  if (!repositories.has(selected)) selected = storageGet(ACTIVE_PROJECT_KEY) || "";
  if (!repositories.has(selected)) {
    selected =
      projects.find(item => item.role === "target" && item.registered !== false)?.repository ||
      projects.find(item => item.role === "control")?.repository ||
      projects[0]?.repository ||
      "";
  }
  if (selected) storageSet(ACTIVE_PROJECT_KEY, selected);

  const selectedProject = projects.find(item => item.repository === selected);
  if (selectedProject?.registered === false) {
    document.body.style.background = "#09111f";
    document.body.innerHTML = `
      <main style="max-width:440px;margin:48px auto;padding:24px;color:#fff;font-family:system-ui">
        <p style="color:#6fe7d2;font-weight:800">Authorized repository</p>
        <h1 style="overflow-wrap:anywhere">${escapeHtml(selected)}</h1>
        <p style="color:#b8c7db;line-height:1.5">
          Pilot can access this repository, but it is not registered yet.
          Registration is a protected Pilot change and still requires package review and merge approval.
        </p>
        <button id="register-project" style="width:100%;min-height:54px;border:0;border-radius:14px;background:#6fe7d2;color:#06131d;font:inherit;font-weight:900">
          Prepare registration
        </button>
        <p id="register-status" style="color:#b8c7db;line-height:1.5"></p>
      </main>`;
    document.querySelector("#register-project").addEventListener("click", async () => {
      const button = document.querySelector("#register-project");
      const status = document.querySelector("#register-status");
      button.disabled = true;
      status.textContent = "Preparing guarded registration package…";
      try {
        const response = await fetch("/api/session?action=project-catalog", {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/json",
            "X-Pilot-Device-Session": deviceSession
          },
          body: JSON.stringify({ repository: selected })
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || !result.registration_package)
          throw new Error(result.error || "Pilot could not prepare project registration.");
        const key = "routalk-pilot.pending-package.v3:" + CONTROL_REPOSITORY;
        const pending = JSON.stringify({
          saved_at: Date.now(),
          command: result.registration_package
        });
        storageSet(key, pending);

        // Verify the handoff survived storage before navigating. Mobile browsers can
        // otherwise make a successful registration preparation look like a no-op.
        if (storageGet(key) !== pending) {
          throw new Error("Pilot could not preserve the registration review on this device.");
        }

        location.assign(
          "/workspace.html?repository=" + encodeURIComponent(CONTROL_REPOSITORY) +
          "&pending_registration=1"
        );
      } catch (error) {
        button.disabled = false;
        status.textContent = error.message || "Project registration could not be prepared.";
        status.style.color = "#ff9a9a";
      }
    });
    return;
  }

  if (selected === CONTROL_REPOSITORY && params.get("pending_registration") === "1") {
    const pendingKey = "routalk-pilot.pending-package.v3:" + CONTROL_REPOSITORY;
    if (!storageGet(pendingKey)) {
      document.body.style.background = "#09111f";
      document.body.innerHTML =
        '<main style="max-width:440px;margin:48px auto;padding:24px;color:#fff;font-family:system-ui">' +
        '<p style="color:#ff9a9a;font-weight:800">Registration handoff interrupted</p>' +
        '<h1>Routalk Pilot</h1>' +
        '<p style="color:#b8c7db;line-height:1.5">Pilot prepared the registration but the browser did not preserve its review package. Return to the available repository and prepare registration again.</p>' +
        '</main>';
      return;
    }
  }

  const indexResponse = await fetch("/index.html", {
    credentials: "same-origin",
    cache: "no-store"
  });
  if (!indexResponse.ok) throw new Error("Pilot workspace could not be loaded.");
  let html = await indexResponse.text();

  const selectorCss = `
.project-context {
  margin:0 0 18px;
  padding:14px;
  border:1px solid #294467;
  border-radius:14px;
  background:#07101d
}
.project-context label {
  margin:0 0 7px;
  color:#8296b0;
  font-size:.72rem;
  letter-spacing:.08em;
  text-transform:uppercase
}
.project-context select {
  width:100%;
  min-height:48px;
  padding:10px 38px 10px 12px;
  border:1px solid #385779;
  border-radius:12px;
  background:#0a1626;
  color:#f4f7fb;
  font:inherit;
  font-weight:800
}
.project-context select:focus {
  outline:3px solid rgba(111,231,210,.24);
  border-color:#6fe7d2
}
.project-context .active-project-note {
  margin:8px 0 0;
  color:#8296b0;
  font-size:.75rem;
  line-height:1.4
}`;

  const options = projects.map(project => {
    const repo = project.repository;
    const name = repo.split("/")[1] || repo;
    const suffix = project.role === "control"
      ? " (Pilot)"
      : project.registered === false
        ? " (available)"
        : "";
    return `<option value="${escapeHtml(repo)}"${repo === selected ? " selected" : ""}>${escapeHtml(name + suffix)}</option>`;
  }).join("");

  const selectorHtml = `
<section class="project-context" aria-label="Active project">
  <label for="active-project">Active project</label>
  <select id="active-project">${options}</select>
  <p class="active-project-note">Pilot shows registered projects plus repositories authorized to its target GitHub credential. Protected actions still require review.</p>
</section>`;

  html = html.replace("</style>", selectorCss + "\n</style>");
  html = html.replace(
    '<section class="workspace-intro" aria-label="Workspace">',
    selectorHtml + '\n<section class="workspace-intro" aria-label="Workspace">'
  );

  const safeSelected = JSON.stringify(selected);
  html = html.replace(
    'const LAST_COMMAND_KEY = "pilot:last-command-id";',
    `const ACTIVE_PROJECT = ${safeSelected};\nconst LAST_COMMAND_KEY = "pilot:last-command-id:" + ACTIVE_PROJECT;`
  );
  html = html.replace(
    'const PENDING_PACKAGE_KEY = "routalk-pilot.pending-package.v3";',
    'const PENDING_PACKAGE_KEY = "routalk-pilot.pending-package.v3:" + ACTIVE_PROJECT;'
  );

  const contextScript = `
<script>
(() => {
  const ACTIVE_PROJECT_KEY = "pilot:active-project.v1";
  const selector = document.querySelector("#active-project");
  const packageInput = document.querySelector("#package-file");
  if (!selector) return;

  selector.addEventListener("change", () => {
    try { localStorage.setItem(ACTIVE_PROJECT_KEY, selector.value); } catch {}
    const next = new URL(location.href);
    next.searchParams.set("repository", selector.value);
    location.assign(next.pathname + next.search);
  });

  if (packageInput) {
    packageInput.addEventListener("change", async () => {
      const file = packageInput.files && packageInput.files[0];
      if (!file) return;
      try {
        const value = JSON.parse(await file.text());
        const effectiveRepository =
          typeof value.repository === "string" && value.repository
            ? value.repository
            : "${CONTROL_REPOSITORY}";
        if (effectiveRepository !== selector.value) {
          packageInput.value = "";
          const status = document.querySelector("#status");
          if (status) {
            status.textContent =
              "This package targets " + effectiveRepository +
              ", but the active project is " + selector.value +
              ". Switch projects before importing it.";
            status.dataset.state = "error";
          }
        }
      } catch {
        // Existing Pilot package validation remains authoritative.
      }
    }, true);
  }
})();
<\/script>`;

  html = html.replace("</body>", contextScript + "\n</body>");
  document.open();
  document.write(html);
  document.close();
})().catch(error => {
  document.body.innerHTML =
    '<main style="max-width:440px;margin:48px auto;padding:24px;color:#fff;font-family:system-ui">' +
    '<h1>Routalk Pilot</h1><p style="color:#ff9a9a">' +
    String(error && error.message || error) + '</p></main>';
  document.body.style.background = "#09111f";
});
</script>
</body>
</html>
