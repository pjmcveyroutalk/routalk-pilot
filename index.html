<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09111f" />
    <title>Routalk Pilot</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: #09111f;
        color: #f4f7fb;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, #173156 0, transparent 42%),
          #09111f;
      }

      main {
        width: min(100%, 440px);
        padding: 28px;
        border: 1px solid #294467;
        border-radius: 24px;
        background: rgba(12, 24, 42, 0.94);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #6fe7d2;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 { margin: 0; font-size: clamp(2rem, 9vw, 3rem); }

      .description {
        margin: 12px 0 24px;
        color: #b8c7db;
        line-height: 1.55;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.9rem;
        font-weight: 700;
      }

      input {
        width: 100%;
        min-height: 50px;
        padding: 12px 14px;
        border: 1px solid #385779;
        border-radius: 12px;
        background: #07101d;
        color: #fff;
        font: inherit;
      }

      input:focus {
        outline: 3px solid rgba(111, 231, 210, 0.24);
        border-color: #6fe7d2;
      }

      button {
        width: 100%;
        min-height: 54px;
        margin-top: 16px;
        border: 0;
        border-radius: 14px;
        background: #6fe7d2;
        color: #06131d;
        font: inherit;
        font-weight: 900;
        cursor: pointer;
      }

      button:disabled { cursor: wait; opacity: 0.65; }

      #status {
        min-height: 24px;
        margin: 16px 0 0;
        color: #b8c7db;
        font-size: 0.92rem;
        line-height: 1.45;
      }

      #status[data-state="success"] { color: #7cf2bd; }
      #status[data-state="error"] { color: #ff9a9a; }

      #results:empty { display: none; }

      #results {
        display: grid;
        gap: 10px;
        margin-top: 14px;
      }

      .result-summary {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .summary-card {
        padding: 12px;
        border: 1px solid #294467;
        border-radius: 12px;
        background: #07101d;
      }

      .summary-label {
        display: block;
        color: #8296b0;
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .summary-value {
        display: block;
        margin-top: 4px;
        color: #f4f7fb;
        font-size: 1rem;
        font-weight: 900;
      }

      .result-link {
        display: block;
        padding: 12px 14px;
        border: 1px solid #385779;
        border-radius: 12px;
        color: #6fe7d2;
        font-weight: 800;
        line-height: 1.35;
        text-decoration: none;
      }

      .result-link:focus,
      .result-link:hover { border-color: #6fe7d2; }

      .merge-button {
        margin-top: 0;
        min-height: 48px;
        border: 1px solid #6fe7d2;
        background: transparent;
        color: #6fe7d2;
      }

      .privacy {
        margin: 20px 0 0;
        color: #8296b0;
        font-size: 0.78rem;
        line-height: 1.45;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .helper {
        margin: 8px 0 0;
        color: #8296b0;
        font-size: 0.78rem;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Mobile development bridge</p>
      <h1>Routalk Pilot</h1>
      <p class="description">
        Start the command bridge immediately instead of waiting for a scheduled cycle.
      </p>

      <form id="dispatch-form" action="/api/dispatch" method="post">
        <label class="sr-only" for="username">Pilot profile</label>
        <input
          class="sr-only"
          id="username"
          name="username"
          type="text"
          value="pilot-operator"
          autocomplete="username"
          readonly
          tabindex="-1"
        />
        <label for="secret">Pilot trigger secret</label>
        <input
          id="secret"
          name="secret"
          type="password"
          autocomplete="current-password"
          required
        />
        <p class="helper">
          Use the saved Pilot trigger password, not a GitHub token.
        </p>
        <button id="run-button" type="submit">Run now</button>
      </form>

      <p id="status" role="status" aria-live="polite"></p>
      <div id="results" aria-label="Pilot results"></div>
      <p class="privacy">
        The secret is used only for this request and is not saved by this page.
      </p>
    </main>

    <script>
      const form = document.querySelector("#dispatch-form");
      const secretInput = document.querySelector("#secret");
      const runButton = document.querySelector("#run-button");
      const status = document.querySelector("#status");
      const results = document.querySelector("#results");

      const wait = (milliseconds) =>
        new Promise((resolve) => setTimeout(resolve, milliseconds));

      function showStatus(message, state = "") {
        status.textContent = message;
        status.dataset.state = state;
      }

      function addResultLink(label, url) {
        if (!url) return;

        const link = document.createElement("a");
        link.className = "result-link";
        link.href = url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = label;
        results.append(link);
      }

      function addMergeButton(pull, secretSession) {
        const button = document.createElement("button");
        button.className = "merge-button";
        button.type = "button";
        button.textContent = `Merge PR #${pull.number}`;

        button.addEventListener("click", async () => {
          if (!secretSession.value || Date.now() > secretSession.expiresAt) {
            secretSession.value = "";
            showStatus("Merge session expired. Run Pilot again to continue.", "error");
            button.disabled = true;
            return;
          }

          const confirmed = window.confirm(
            `Merge PR #${pull.number} into main and delete its branch?`,
          );

          if (!confirmed) return;

          button.disabled = true;
          button.textContent = "Merging…";
          showStatus(`Validating and merging PR #${pull.number}…`);

          try {
            const response = await fetch("/api/merge", {
              method: "POST",
              headers: {
                Authorization: `Bearer ${secretSession.value}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ pr_number: pull.number }),
            });
            const result = await response.json().catch(() => ({}));

            if (!response.ok) {
              throw new Error(result.error || `Merge failed (${response.status})`);
            }

            button.textContent = `PR #${pull.number} merged`;
            showStatus(
              `PR #${pull.number} merged successfully${result.branch_deleted ? " and its branch was deleted" : ""}.`,
              "success",
            );
          } catch (error) {
            button.disabled = false;
            button.textContent = `Retry merge PR #${pull.number}`;
            showStatus(error.message || "Pull request could not be merged.", "error");
          }
        });

        results.append(button);
      }

      function addSummary(workflow, pullRequests, newPullRequestCount) {
        const summary = document.createElement("div");
        summary.className = "result-summary";

        const items = [
          [
            "Workflow",
            workflow.conclusion === "success"
              ? "Successful"
              : workflow.conclusion || "Unknown",
          ],
          [
            "New PRs",
            String(newPullRequestCount),
          ],
        ];

        for (const [label, value] of items) {
          const card = document.createElement("div");
          card.className = "summary-card";

          const labelElement = document.createElement("span");
          labelElement.className = "summary-label";
          labelElement.textContent = label;

          const valueElement = document.createElement("strong");
          valueElement.className = "summary-value";
          valueElement.textContent = value;

          card.append(labelElement, valueElement);
          summary.append(card);
        }

        results.append(summary);
      }

      async function monitorPilot(secretSession, startedAt) {
        const deadline = Date.now() + 90_000;

        while (Date.now() < deadline) {
          await wait(3_000);

          const response = await fetch(
            `/api/status?started_at=${encodeURIComponent(startedAt)}`,
            {
              method: "GET",
              headers: { Authorization: `Bearer ${secretSession.value}` },
              cache: "no-store",
            },
          );
          const result = await response.json().catch(() => ({}));

          if (!response.ok) {
            throw new Error(result.error || `Status check failed (${response.status})`);
          }

          if (!result.workflow) {
            showStatus("Pilot accepted. Waiting for GitHub to start…");
            continue;
          }

          if (result.workflow.status !== "completed") {
            showStatus("Pilot is running in GitHub…");
            continue;
          }

          results.replaceChildren();
          const pullRequests = result.pull_requests || [];
          const newPullRequestCount =
            result.new_pull_request_count ?? pullRequests.length;
          addSummary(result.workflow, pullRequests, newPullRequestCount);
          addResultLink("Open workflow results", result.workflow.html_url);

          for (const pull of pullRequests) {
            const state = pull.draft ? "Draft" : "Ready";
            addResultLink(
              `${state} PR #${pull.number}: ${pull.title}`,
              pull.html_url,
            );
            addMergeButton(pull, secretSession);
          }

          if (result.workflow.conclusion === "success") {
            const prMessage = newPullRequestCount
              ? ` ${newPullRequestCount} new pull request${newPullRequestCount === 1 ? " is" : "s are"} ready below.`
              : pullRequests.length
                ? ` No new pull request was created. ${pullRequests.length} eligible open pull request${pullRequests.length === 1 ? " remains" : "s remain"} below.`
                : " No new pull request was created.";
            showStatus(`Pilot finished successfully.${prMessage}`, "success");
          } else {
            showStatus(
              `Pilot finished with ${result.workflow.conclusion || "an unknown result"}. Open the workflow below.`,
              "error",
            );
          }

          return;
        }

        showStatus(
          "Pilot is taking longer than expected. Check GitHub Actions for the final result.",
          "error",
        );
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        let secret = secretInput.value;

        if (!secret) {
          showStatus("Enter the Pilot trigger secret.", "error");
          return;
        }

        runButton.disabled = true;
        runButton.textContent = "Starting…";
        showStatus("Starting Pilot…");
        results.replaceChildren();
        const startedAt = new Date().toISOString();

        try {
          const response = await fetch("/api/dispatch", {
            method: "POST",
            headers: { Authorization: `Bearer ${secret}` },
          });

          const result = await response.json().catch(() => ({}));

          if (!response.ok) {
            throw new Error(result.error || `Request failed (${response.status})`);
          }

          secretInput.value = "";
          showStatus("Pilot started. Checking GitHub progress now…", "success");
          runButton.textContent = "Monitoring…";
          const secretSession = {
            value: secret,
            expiresAt: Date.now() + 10 * 60 * 1000,
          };
          setTimeout(() => {
            secretSession.value = "";
          }, 10 * 60 * 1000);
          await monitorPilot(secretSession, startedAt);
        } catch (error) {
          showStatus(error.message || "Pilot could not be started.", "error");
        } finally {
          secret = "";
          runButton.disabled = false;
          runButton.textContent = "Run now";
        }
      });
    </script>
  </body>
</html>
