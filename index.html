<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09111f" />
    <title>Routalk Pilot</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: #09111f;
        color: #f4f7fb;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, #173156 0, transparent 42%),
          #09111f;
      }

      main {
        width: min(100%, 440px);
        padding: 28px;
        border: 1px solid #294467;
        border-radius: 24px;
        background: rgba(12, 24, 42, 0.94);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #6fe7d2;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 { margin: 0; font-size: clamp(2rem, 9vw, 3rem); }

      .description {
        margin: 12px 0 24px;
        color: #b8c7db;
        line-height: 1.55;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.9rem;
        font-weight: 700;
      }

      input {
        width: 100%;
        min-height: 50px;
        padding: 12px 14px;
        border: 1px solid #385779;
        border-radius: 12px;
        background: #07101d;
        color: #fff;
        font: inherit;
      }

      input:focus {
        outline: 3px solid rgba(111, 231, 210, 0.24);
        border-color: #6fe7d2;
      }

      button {
        width: 100%;
        min-height: 54px;
        margin-top: 16px;
        border: 0;
        border-radius: 14px;
        background: #6fe7d2;
        color: #06131d;
        font: inherit;
        font-weight: 900;
        cursor: pointer;
      }

      button:disabled { cursor: wait; opacity: 0.65; }

      #status {
        min-height: 24px;
        margin: 16px 0 0;
        color: #b8c7db;
        font-size: 0.92rem;
        line-height: 1.45;
      }

      #status[data-state="success"] { color: #7cf2bd; }
      #status[data-state="error"] { color: #ff9a9a; }

      .privacy {
        margin: 20px 0 0;
        color: #8296b0;
        font-size: 0.78rem;
        line-height: 1.45;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .helper {
        margin: 8px 0 0;
        color: #8296b0;
        font-size: 0.78rem;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Mobile development bridge</p>
      <h1>Routalk Pilot</h1>
      <p class="description">
        Start the command bridge immediately instead of waiting for a scheduled cycle.
      </p>

      <form id="dispatch-form" action="/api/dispatch" method="post">
        <label class="sr-only" for="username">Pilot profile</label>
        <input
          class="sr-only"
          id="username"
          name="username"
          type="text"
          value="pilot-operator"
          autocomplete="username"
          readonly
          tabindex="-1"
        />
        <label for="secret">Pilot trigger secret</label>
        <input
          id="secret"
          name="secret"
          type="password"
          autocomplete="current-password"
          required
        />
        <p class="helper">
          Use the saved Pilot trigger password, not a GitHub token.
        </p>
        <button id="run-button" type="submit">Run now</button>
      </form>

      <p id="status" role="status" aria-live="polite"></p>
      <p class="privacy">
        The secret is used only for this request and is not saved by this page.
      </p>
    </main>

    <script>
      const form = document.querySelector("#dispatch-form");
      const secretInput = document.querySelector("#secret");
      const runButton = document.querySelector("#run-button");
      const status = document.querySelector("#status");

      function showStatus(message, state = "") {
        status.textContent = message;
        status.dataset.state = state;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const secret = secretInput.value;

        if (!secret) {
          showStatus("Enter the Pilot trigger secret.", "error");
          return;
        }

        runButton.disabled = true;
        runButton.textContent = "Starting…";
        showStatus("Starting Pilot…");

        try {
          const response = await fetch("/api/dispatch", {
            method: "POST",
            headers: { Authorization: `Bearer ${secret}` },
          });

          const result = await response.json().catch(() => ({}));

          if (!response.ok) {
            throw new Error(result.error || `Request failed (${response.status})`);
          }

          showStatus("Pilot started. The command queue is processing now.", "success");
          secretInput.value = "";
        } catch (error) {
          showStatus(error.message || "Pilot could not be started.", "error");
        } finally {
          runButton.disabled = false;
          runButton.textContent = "Run now";
        }
      });
    </script>
  </body>
</html>
