<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project preflight — Routalk Pilot</title></head><body><main><h1>Project preflight</h1><p>Run Pilot's authoritative target-readiness check without creating or queueing a build command.</p><form id="f"><label>Target repository <input id="r" required></label><label>Pilot trigger secret <input id="s" type="password" required></label><button>Run preflight</button></form><pre id="o"></pre></main><script>const p=new URLSearchParams(location.search);r.value=p.get("repository")||"";f.onsubmit=async e=>{e.preventDefault();o.textContent="Running…";const secret=s.value;s.value="";try{const x=await fetch("/api/project-preflight",{method:"POST",headers:{Authorization:`Bearer ${secret}`,"Content-Type":"application/json"},body:JSON.stringify({repository:r.value.trim()})});const d=await x.json().catch(()=>({}));o.textContent=JSON.stringify(d,null,2)}catch(err){o.textContent=err.message||"Preflight failed"}};</script></body></html>
