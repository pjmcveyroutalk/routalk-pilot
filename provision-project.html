<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#09111f" />
<title>Provision deployment — Routalk Pilot</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;background:#09111f;color:#f4f7fb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#173156 0,transparent 42%),#09111f}
main{width:min(100%,440px);padding:28px;border:1px solid #294467;border-radius:24px;background:rgba(12,24,42,.94);box-shadow:0 24px 70px rgba(0,0,0,.35)}
.eyebrow{margin:0 0 8px;color:#6fe7d2;font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
h1{margin:0;font-size:clamp(2rem,9vw,3rem)}
.description{margin:12px 0 24px;color:#b8c7db;line-height:1.55}
label{display:block;margin:16px 0 8px;font-size:.9rem;font-weight:700}
input{width:100%;min-height:50px;padding:12px 14px;border:1px solid #385779;border-radius:12px;background:#07101d;color:#fff;font:inherit}
input:focus{outline:3px solid rgba(111,231,210,.24);border-color:#6fe7d2}
.approval{display:flex;align-items:flex-start;gap:10px;margin-top:18px;color:#b8c7db;line-height:1.4}
.approval input{width:20px;min-height:20px;margin:2px 0 0;flex:0 0 auto}
button,.result-link{width:100%;min-height:54px;margin-top:18px;border:0;border-radius:14px;background:#6fe7d2;color:#06131d;font:inherit;font-weight:900;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
#status{min-height:24px;margin:16px 0 0;color:#b8c7db;font-size:.92rem;line-height:1.45;white-space:pre-line}
#status[data-state="success"]{color:#7cf2bd}
#status[data-state="error"]{color:#ff9a9a}
.result-link{display:grid;place-items:center;padding:12px 14px;border:1px solid #385779;background:transparent;color:#6fe7d2;text-align:center;text-decoration:none}
.helper{margin:8px 0 0;color:#8296b0;font-size:.78rem;line-height:1.45}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<p class="eyebrow">Routalk Pilot</p>
<h1>Provision deployment</h1>
<p class="description">Create and link the Vercel deployment project for a registered Pilot repository. This does not bypass Pilot's verifier or merge gates.</p>

<form id="form">
<div id="auth-entry" hidden>
<label for="secret">Pilot trigger secret</label>
<input id="secret" type="password" autocomplete="current-password" />
<p class="helper">Enter it once only if this device is not already unlocked.</p>
</div>

<label for="repository">Repository</label>
<input id="repository" type="text" autocomplete="off" placeholder="owner/project" required />

<label class="approval">
<input id="approval" type="checkbox" />
<span>I approve Pilot creating or locating the deployment project for this registered repository.</span>
</label>

<button id="button" type="submit" disabled>Provision deployment project</button>
</form>

<p id="status" role="status" aria-live="polite"></p>
<div id="result"></div>
</main>

<script>
const DEVICE_SESSION_KEY = "pilot:device-session.v1";
const form = document.querySelector("#form");
const authEntry = document.querySelector("#auth-entry");
const secret = document.querySelector("#secret");
const repository = document.querySelector("#repository");
const approval = document.querySelector("#approval");
const button = document.querySelector("#button");
const status = document.querySelector("#status");
const result = document.querySelector("#result");
let sessionAuthenticated = false;

const initialRepository = new URLSearchParams(location.search).get("repository");
if (initialRepository) repository.value = initialRepository;

function safeStorageGet(key) {
  try { return localStorage.getItem(key); } catch { return null; }
}
function safeStorageSet(key, value) {
  try { localStorage.setItem(key, value); } catch {}
}
function safeStorageRemove(key) {
  try { localStorage.removeItem(key); } catch {}
}
function readDeviceSession() {
  return safeStorageGet(DEVICE_SESSION_KEY) || "";
}
function deviceSessionHeaders(extra = {}) {
  const token = readDeviceSession();
  return token ? { ...extra, "X-Pilot-Device-Session": token } : { ...extra };
}
function setSessionState(authenticated) {
  sessionAuthenticated = authenticated === true;
  authEntry.hidden = sessionAuthenticated;
  if (!sessionAuthenticated) secret.value = "";
  refreshButton();
}
async function readSessionState() {
  try {
    const response = await fetch("/api/session", {
      method: "GET",
      credentials: "same-origin",
      cache: "no-store",
      headers: deviceSessionHeaders(),
    });
    const data = await response.json().catch(() => ({}));
    const authenticated = response.ok && data.authenticated === true;
    if (!authenticated && response.status === 401) safeStorageRemove(DEVICE_SESSION_KEY);
    setSessionState(authenticated);
  } catch {
    setSessionState(false);
  }
  return sessionAuthenticated;
}
async function ensureSession() {
  if (sessionAuthenticated) return true;
  if (readDeviceSession() && await readSessionState()) return true;

  const pilotSecret = secret.value;
  if (!pilotSecret) {
    authEntry.hidden = false;
    showStatus("Pilot is locked on this device. Enter the trigger secret once.", "error");
    return false;
  }

  const response = await fetch("/api/session", {
    method: "POST",
    credentials: "same-origin",
    headers: { Authorization: `Bearer ${pilotSecret}` },
  });
  const data = await response.json().catch(() => ({}));
  secret.value = "";
  if (!response.ok || data.authenticated !== true || typeof data.device_session !== "string") {
    safeStorageRemove(DEVICE_SESSION_KEY);
    setSessionState(false);
    throw new Error(data.error || "Pilot could not unlock this device.");
  }
  safeStorageSet(DEVICE_SESSION_KEY, data.device_session);
  setSessionState(true);
  return true;
}
function handleAuthFailure(response) {
  if (response.status !== 401) return false;
  safeStorageRemove(DEVICE_SESSION_KEY);
  setSessionState(false);
  showStatus("Pilot is locked. Enter the trigger secret once and retry.", "error");
  return true;
}
function refreshButton() {
  button.disabled = !approval.checked || !repository.value.trim() || (!sessionAuthenticated && !secret.value);
}
function showStatus(message, state = "") {
  status.textContent = message;
  status.dataset.state = state;
}
function addResultLink(label, href) {
  const link = document.createElement("a");
  link.className = "result-link";
  link.href = href;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  link.textContent = label;
  result.append(link);
}

for (const element of [secret, repository, approval]) {
  element.addEventListener("input", refreshButton);
  element.addEventListener("change", refreshButton);
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  if (!approval.checked) return;

  const repo = repository.value.trim();

  button.disabled = true;
  result.replaceChildren();
  showStatus(`Provisioning deployment project for ${repo}…`);

  try {
    if (!(await ensureSession())) return;

    const response = await fetch("/api/session?action=provision-vercel-project", {
      method: "POST",
      credentials: "same-origin",
      headers: deviceSessionHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify({ repository: repo }),
    });
    const data = await response.json().catch(() => ({}));
    if (handleAuthFailure(response))
      throw new Error("Pilot session expired. Unlock this device and retry.");

    if (!response.ok)
      throw new Error(data.error || `Deployment provisioning failed (${response.status}).`);

    showStatus(
      data.already_exists
        ? `Deployment project already exists for ${repo}.`
        : `Deployment project created and linked for ${repo}.`,
      "success",
    );

    if (data.expected_production_url) {
      addResultLink("Open expected production URL", data.expected_production_url);
    }

    approval.checked = false;
  } catch (error) {
    showStatus(error.message || "Deployment provisioning failed.", "error");
  } finally {
    refreshButton();
  }
});

readSessionState().then(() => {
  if (!sessionAuthenticated) authEntry.hidden = false;
  refreshButton();
});
</script>
</body>
</html>
